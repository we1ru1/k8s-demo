apiVersion: apiextensions.k8s.io/v1    #crd YAML
kind: CustomResourceDefinition
metadata:
  name: staticsites.demo.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only"
spec:
  group: demo.k8s.io
  scope: Namespaced
  names:
    plural: staticsites
    singular: staticsite
    kind: StaticSite
    shortNames:
      - ss
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                imagePullPolicy:
                  type: string
                  enum:
                    - Always
                    - IfNotPresent
                    - Never
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                availableReplicas:
                  type: integer
                  format: int32
